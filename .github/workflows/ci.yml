name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest

    # ✅ 启动 MySQL 服务容器
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Root@123456
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v3

    - name: 2. 设置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.13.3'  # 与本地环境保持一致

    - name: 3. 安装依赖
      run: |
        cd app
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. 代码检查 (Lint)
      run: |
        pip install flake8
        # 使用标准配置，避免注释导致的错误
        flake8 app/ --max-line-length=120 --ignore=W291,W292,W293,E302,E305

    - name: 5. 初始化数据库
      run: |
        cd app
        python database.py
      env:
        DB_HOST: 127.0.0.1
        DB_USER: root
        DB_PASS: Root@123456
        DB_NAME: testdb

    - name: 6. 启动应用（后台）
      run: |
        cd app
        python app.py &
        # 等待应用启动
        sleep 10
      env:
        DB_HOST: 127.0.0.1
        DB_USER: root
        DB_PASS: Root@123456
        DB_NAME: testdb

    - name: 7. 内容验证（健康检查）
      run: |
        # 添加重试机制，确保应用完全启动
        for i in {1..5}; do
          curl -f http://127.0.0.1:5000 && break
          echo "等待应用启动，第 $i 次尝试..."
          sleep 5
        done

    - name: 8. 构建 Docker 镜像
      run: |
        cd app
        docker build -t mysql-test-app:latest .