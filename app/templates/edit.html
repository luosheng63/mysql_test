<!DOCTYPE html>
<html>
<head>
    <title>Edit User</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 60px; }
        input[type="text"], input[type="number"], select {
            padding: 8px; width: 200px; border: 1px solid #ccc; border-radius: 4px;
        }
        button { padding: 8px 15px; background-color: #008CBA; color: white; border: none; border-radius: 4px; cursor: pointer;}
    </style>
</head>
<body>
    <h1>Edit User</h1>
    <form action="/edit/{{ user.id }}" method="post">
        <div class="form-group">
            <label>Name:</label>
            <input type="text" name="name" value="{{ user.name }}" required>
        </div>
        <div class="form-group">
            <label>Gender:</label>
            <!-- 这里用 Jinja2 判断哪个是选中的 -->
            <select name="gender">
                <option value="男" {% if user.gender == '男' %}selected{% endif %}>男</option>
                <option value="女" {% if user.gender == '女' %}selected{% endif %}>女</option>
                <option value="未知" {% if user.gender == '未知' or not user.gender %}selected{% endif %}>未知</option>
            </select>
        </div>
        <div class="form-group">
            <label>Age:</label>
            <input type="number" name="age" value="{{ user.age }}" required>
        </div>
        <button type="submit">Update</button>
        <a href="/" style="margin-left: 10px;">Cancel</a>
    </form>
</body>
</html>
