{% extends "base.html" %}

{% block title %}用户注册{% endblock %}

{% block content %}
<div class="form-container">
    <h2>用户注册</h2>
    <form id="registerForm">
        <div class="form-group">
            <label for="phone">手机号码</label>
            <input type="tel" id="phone" name="phone" required placeholder="请输入11位手机号">
        </div>
        
        <div class="form-group">
            <label for="code">验证码</label>
            <div class="code-input">
                <input type="text" id="code" name="code" required placeholder="6位验证码">
                <button type="button" id="sendCodeBtn" onclick="sendCode()">发送验证码</button>
            </div>
        </div>
        
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required placeholder="8-20位，包含字母和数字">
            <div class="password-strength" id="passwordStrength"></div>
        </div>
        
        <div class="form-group">
            <label for="confirmPassword">确认密码</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="再次输入密码">
        </div>
        
        <button type="submit" class="btn btn-primary">注册</button>
        
        <div class="form-footer">
            已有账号？ <a href="/login">立即登录</a>
        </div>
    </form>
</div>

<script>
let countdown = 0;
let timer = null;

// ===== 1. 前端实时验证函数 =====
function validatePhone(phone) {
    const pattern = /^1[3-9]\d{9}$/;
    return pattern.test(phone);
}

function validatePassword(password) {
    if (password.length < 8 || password.length > 20) {
        return { valid: false, message: '密码长度需在8-20位之间' };
    }
    if (!/[A-Za-z]/.test(password) || !/\d/.test(password)) {
        return { valid: false, message: '密码必须包含字母和数字' };
    }
    return { valid: true, message: '' };
}

// ===== 2. 实时密码强度显示 =====
document.addEventListener('DOMContentLoaded', function () {
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const strengthDiv = document.getElementById('passwordStrength');

    if (passwordInput) {
        passwordInput.addEventListener('input', function () {
            const password = this.value;
            const validation = validatePassword(password);

            if (password === '') {
                strengthDiv.innerHTML = '';
                return;
            }

            if (validation.valid) {
                strengthDiv.innerHTML = '<span style="color: #2ed573; font-weight: bold;">✓ 密码强度合格</span>';
            } else {
                strengthDiv.innerHTML = `<span style="color: #ff4757;">✗ ${validation.message}</span>`;
            }
        });
    }

    // 确认密码一致性检查
    if (confirmPasswordInput) {
        confirmPasswordInput.addEventListener('input', function () {
            if (passwordInput.value !== this.value) {
                this.setCustomValidity('两次密码不一致');
            } else {
                this.setCustomValidity('');
            }
        });
    }
});

// ===== 3. 发送验证码 =====
async function sendCode() {
    const phoneInput = document.getElementById('phone');
    const phone = phoneInput.value.trim();

    if (!validatePhone(phone)) {
        alert('请输入正确的手机号');
        phoneInput.focus();
        return;
    }

    const btn = document.getElementById('sendCodeBtn');
    btn.disabled = true;
    btn.textContent = '发送中...';

    try {
        const response = await fetch('/api/send-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: phone })
        });

        const data = await response.json();

        if (response.ok) {
            alert('验证码已发送（请查看服务端控制台）');
            startCountdown(btn);
        } else {
            alert(data.error || '发送失败');
            btn.disabled = false;
            btn.textContent = '发送验证码';
        }
    } catch (error) {
        alert('网络错误，请重试');
        btn.disabled = false;
        btn.textContent = '发送验证码';
    }
}

// ===== 4. 倒计时逻辑 =====
function startCountdown(btn) {
    countdown = 60;
    btn.textContent = `${countdown}s 后重试`;

    timer = setInterval(() => {
        countdown--;
        btn.textContent = `${countdown}s 后重试`;

        if (countdown <= 0) {
            clearInterval(timer);
            btn.disabled = false;
            btn.textContent = '发送验证码';
        }
    }, 1000);
}

// ===== 5. 表单提交（核心优化）=====
document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const form = new FormData(this);
    const data = Object.fromEntries(form);

    // ---- 前端预校验（不消耗验证码）----
    if (!validatePhone(data.phone)) {
        alert('手机号格式不正确');
        return;
    }

    if (!validatePassword(data.password).valid) {
        alert(validatePassword(data.password).message);
        return;
    }

    if (data.password !== data.confirmPassword) {
        alert('两次输入的密码不一致');
        return;
    }

    if (!data.code || data.code.length !== 6) {
        alert('请输入6位验证码');
        return;
    }

    // ---- 开始提交 ----
    const submitBtn = document.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = '注册中...';

    try {
        const response = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
            alert('注册成功！');
            localStorage.setItem('token', result.token);
            window.location.href = '/profile';
        } else {
            alert(result.error || '注册失败');
            // 如果验证码过期，重置倒计时
            if (result.error.includes('过期')) {
                clearInterval(timer);
                const sendBtn = document.getElementById('sendCodeBtn');
                sendBtn.disabled = false;
                sendBtn.textContent = '重新发送验证码';
            }
        }
    } catch (error) {
        alert('网络错误，请重试');
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
    }
});
</script>
{% endblock %}
